spring:
  task:
    scheduling:
      pool:
        # Spring Boot defaults @Scheduled to a single shared thread. The two
        # remaining scheduled tasks (BatchCoordinator's timeout sweep, the
        # idle-flush sweep) are lightweight and infrequent, but this still
        # keeps them from serializing behind each other or the metrics summary.
        # StagingBuffer no longer uses @Scheduled at all (see StagingBuffer),
        # and Parquet writes run on their own dedicated pool (writer-threads).
        size: 4
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: onprem-ingestion-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      fetch-min-size: 1048576
      fetch-max-wait: 500
    listener:
      ack-mode: MANUAL_IMMEDIATE
      type: BATCH
      concurrency: 1
    # Low-latency fetch settings for the control-doc consumer specifically — see
    # KafkaConsumerConfig's controlConsumerFactory for why this topic needs its
    # own settings instead of sharing the primary/retry topics' fetch-min-size.
    control-consumer:
      fetch-min-size: 1
      fetch-max-wait: 50

ingestion:
  worker-pool-size: 8
  dedup-cache-ttl-minutes: 60
  metrics:
    log-interval-ms: 15000
  batch:
    timeout-minutes: 5
    timeout-check-interval-ms: 30000
  staging:
    queue-capacity: 200000
  retry:
    max-attempts: 3
    backoff-base-ms: 2000
  topics:
    control: banking-control
    primary: banking-transactions
    retry: banking-transactions-retry
    dlq: banking-transactions-dlq
  intelligence:
    quality:
      threshold: 0.7
    parquet:
      # Primary flush trigger — estimated buffered bytes, not row count. See
      # ParquetProperties for how the estimate is derived and why it's
      # tracked separately from the actual post-compression file size.
      target-file-size-mb: 32
      # Hard safety cap, not the normal trigger — see ParquetProperties.
      max-events-per-file-safety-cap: 200000
      idle-flush-ms: 5000
      writer-threads: 8
  query:
    max-rows: 10000
    spark:
      enabled: false

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:adaptive-data-lake}
